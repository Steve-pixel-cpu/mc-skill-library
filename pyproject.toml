[project]
name = "mc-skill-library"
version = "0.1.0"
description = "为 LLM Agent 设计的技能库: 语义检索 + 可执行代码 (MCP server)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mc_skill_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
